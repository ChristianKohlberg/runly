<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 830" width="1440" height="830" role="img" aria-labelledby="title desc">
  <title id="title">Runly: idle services sleep, new traffic wakes them</title>
  <desc id="desc">One Runly proxy provides stable URLs and unique ports for three worktrees. Project A has two independent worktrees sharing Database A with separate data. Project B has one worktree using Database B. Worktree B's app is sleeping; its proxy route and data remain. A new connection triggers wake.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="var(--grid, #e3eaf0)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5 1 8" fill="none" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5 1 8" fill="none" stroke="var(--blue, #3275aa)" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4.5 1 8" fill="none" stroke="var(--green, #388455)" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    /* Light by default; follow the system preference when embedded as an image. */
    :root {
      --canvas: #ffffff;
      --grid: #e3eaf0;
      --text: #172b36;
      --muted: #526674;
      --line: #586f7c;
      --teal: #087f79;
      --panel: #f2f9f8;
      --app: #ffffff;
      --blue: #3275aa;
      --blue-panel: #edf5fc;
      --blue-data: #ffffff;
      --blue-title: #255f8d;
      --blue-muted: #47677f;
      --green: #388455;
      --green-panel: #f0f8f2;
      --green-data: #ffffff;
      --green-title: #286b43;
      --green-muted: #4b6e56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #101a20;
        --grid: #20323b;
        --text: #dae5ec;
        --muted: #aabdc9;
        --line: #b9cbd5;
        --teal: #45d9cf;
        --panel: #122229;
        --app: #15232b;
        --blue: #76b8ef;
        --blue-panel: #112330;
        --blue-data: #142a37;
        --blue-title: #8bc7f5;
        --blue-muted: #a9c9de;
        --green: #92d8a2;
        --green-panel: #14271f;
        --green-data: #192f25;
        --green-title: #a0dfae;
        --green-muted: #b2d5bd;
      }
    }
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    path, rect { vector-effect: non-scaling-stroke; }
  </style>
  <rect width="1440" height="830" fill="var(--canvas, #ffffff)"/>
  <rect width="1440" height="830" fill="url(#grid)"/>
  <text x="720" y="62" font-size="32" fill="var(--text, #172b36)" text-anchor="middle" font-weight="600">Idle services sleep. New traffic wakes them.</text>
  <text x="720" y="96" font-size="20" fill="var(--muted, #526674)" text-anchor="middle" font-weight="400">Worktrees and data stay.</text>
  <g id="proxy">
    <title>Runly daemon proxy: stable URLs, allocated unique ports, and activity-driven wake</title>
    <rect x="40" y="135" width="1360" height="126" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
    <text x="60" y="167" font-size="18" fill="var(--text, #172b36)" text-anchor="start" font-weight="600">RUNLY PROXY</text>
    <g id="route-0">
      <title>Stable public URL and distinct allocated port for worktree A</title>
      <rect x="135" y="195" width="290" height="42" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
      <text x="280" y="222" font-size="16" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Stable URL · unique port</text>
    </g>
    <g id="route-1">
      <title>Stable public URL and distinct allocated port for worktree B</title>
      <rect x="575" y="195" width="290" height="42" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
      <text x="720" y="222" font-size="16" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Stable URL · unique port</text>
    </g>
    <g id="route-2">
      <title>Stable public URL and distinct allocated port for worktree C</title>
      <rect x="1015" y="195" width="290" height="42" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
      <text x="1160" y="222" font-size="16" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Stable URL · unique port</text>
    </g>
  </g>
  <g id="projects">
    <title>Project A groups two worktrees; Project B has its own worktree</title>
    <text x="500" y="310" font-size="17" fill="var(--line, #586f7c)" text-anchor="middle" font-weight="400">PROJECT A</text>
    <text x="1250" y="310" font-size="17" fill="var(--line, #586f7c)" text-anchor="middle" font-weight="400">PROJECT B</text>
    <path d="M100 342v-14h800v14M980 342v-14h360v14" stroke="var(--muted, #526674)" stroke-width="1.4" fill="none"/>
  </g>
  <g id="worktree-a">
    <title>Worktree A: app services running</title>
    <path d="M280 237V358" fill="none" stroke="var(--teal, #087f79)" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
    <rect x="100" y="360" width="360" height="160" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
    <text x="280" y="402" font-size="22" fill="var(--text, #172b36)" text-anchor="middle" font-weight="600">Worktree A</text>
    <rect x="140" y="432" width="280" height="58" rx="3" fill="var(--app, #ffffff)" stroke="var(--line, #586f7c)" stroke-width="1.5"/>
    <text x="280" y="468" font-size="19" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">App · running</text>
  </g>
  <g id="worktree-b">
    <title>Worktree B: services stopped while data and proxy remain</title>
    <path d="M720 237V358" fill="none" stroke="var(--teal, #087f79)" stroke-width="1.8" stroke-dasharray="6 7" marker-end="url(#arrow-teal)"/>
    <text x="736" y="290" font-size="15" fill="var(--line, #586f7c)" text-anchor="start" font-weight="400">wake</text>
    <rect x="540" y="360" width="360" height="160" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
    <text x="720" y="402" font-size="22" fill="var(--text, #172b36)" text-anchor="middle" font-weight="600">Worktree B</text>
    <rect x="580" y="432" width="280" height="58" rx="3" fill="var(--app, #ffffff)" stroke="var(--line, #586f7c)" stroke-width="1.5"/>
    <text x="720" y="468" font-size="19" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">App · sleeping</text>
  </g>
  <g id="worktree-c">
    <title>Worktree C: app services running</title>
    <path d="M1160 237V358" fill="none" stroke="var(--teal, #087f79)" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
    <rect x="980" y="360" width="360" height="160" rx="3" fill="var(--panel, #f2f9f8)" stroke="var(--teal, #087f79)" stroke-width="1.5"/>
    <text x="1160" y="402" font-size="22" fill="var(--text, #172b36)" text-anchor="middle" font-weight="600">Worktree C</text>
    <rect x="1020" y="432" width="280" height="58" rx="3" fill="var(--app, #ffffff)" stroke="var(--line, #586f7c)" stroke-width="1.5"/>
    <text x="1160" y="468" font-size="19" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">App · running</text>
  </g>
  <g id="database-a">
    <title>One shared backing instance, with independent retained data for worktrees A and B</title>
    <rect x="100" y="575" width="800" height="170" rx="3" fill="var(--blue-panel, #edf5fc)" stroke="var(--blue, #3275aa)" stroke-width="1.5"/>
    <text x="500" y="610" font-size="21" fill="var(--blue-title, #255f8d)" text-anchor="middle" font-weight="600">Database A</text>
    <path d="M280 490V638" fill="none" stroke="var(--blue, #3275aa)" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <rect x="140" y="640" width="280" height="80" rx="3" fill="var(--blue-data, #ffffff)" stroke="var(--blue, #3275aa)" stroke-width="1.5"/>
    <text x="280" y="672" font-size="18" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Worktree A data</text>
    <text x="280" y="699" font-size="15" fill="var(--blue-muted, #47677f)" text-anchor="middle" font-weight="400">data kept</text>
    <path d="M720 490V638" fill="none" stroke="var(--blue, #3275aa)" stroke-width="1.8" stroke-dasharray="6 7" marker-end="url(#arrow-blue)"/>
    <rect x="580" y="640" width="280" height="80" rx="3" fill="var(--blue-data, #ffffff)" stroke="var(--blue, #3275aa)" stroke-width="1.5"/>
    <text x="720" y="672" font-size="18" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Worktree B data</text>
    <text x="720" y="699" font-size="15" fill="var(--blue-muted, #47677f)" text-anchor="middle" font-weight="400">data kept</text>
  </g>
  <g id="database-b">
    <title>A separate backing instance for worktree C; data persists while its app sleeps</title>
    <rect x="980" y="575" width="360" height="170" rx="3" fill="var(--green-panel, #f0f8f2)" stroke="var(--green, #388455)" stroke-width="1.5"/>
    <text x="1000" y="610" font-size="21" fill="var(--green-title, #286b43)" text-anchor="start" font-weight="600">Database B</text>
    <path d="M1160 490V638" fill="none" stroke="var(--green, #388455)" stroke-width="1.8" marker-end="url(#arrow-green)"/>
    <rect x="1020" y="640" width="280" height="80" rx="3" fill="var(--green-data, #ffffff)" stroke="var(--green, #388455)" stroke-width="1.5"/>
    <text x="1160" y="672" font-size="18" fill="var(--text, #172b36)" text-anchor="middle" font-weight="400">Worktree C data</text>
    <text x="1160" y="699" font-size="15" fill="var(--green-muted, #4b6e56)" text-anchor="middle" font-weight="400">data kept</text>
  </g>
  <g id="legend">
    <title>Solid connections represent running services; dashed connections show idle services and wake paths</title>
    <path d="M100 787h28" stroke="var(--muted, #526674)" stroke-width="1.5"/>
    <path d="M310 787h28" stroke="var(--muted, #526674)" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="140" y="792" font-size="14" fill="var(--muted, #526674)" text-anchor="start" font-weight="400">running</text>
    <text x="350" y="792" font-size="14" fill="var(--muted, #526674)" text-anchor="start" font-weight="400">sleeping / wake</text>
  </g>
</svg>
